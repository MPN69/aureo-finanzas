<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Áureo Finanzas — Personal y Pareja</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <img src="./assets/icon.svg" alt="Áureo" class="brand-logo" />
        <div>
          <span class="brand-title">Áureo Finanzas</span>
          <span class="brand-sub">Personal &amp; Pareja</span>
        </div>
      </div>

      <div class="workspace-switcher" id="desktop-ws-switcher" role="tablist" aria-label="Modo de vista">
        <button class="ws-btn" data-ws="solo_a" title="Solo mis finanzas personales">Solo</button>
        <button class="ws-btn" data-ws="couple" title="Finanzas compartidas en pareja">Pareja</button>
        <button class="ws-btn" data-ws="all" title="Consolidado del hogar">Todo</button>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-primary" id="btn-new-tx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          Registrar
        </button>
        <button class="btn btn-icon" id="btn-scan-receipt" title="Escanear recibo con IA">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 0-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2"/><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M7 12h10"/></svg>
        </button>
      </div>

      <nav class="nav-list" id="sidebar-nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Resumen
        </button>
        <button class="nav-item" data-view="ledger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
          Movimientos y Calendario
        </button>
        <button class="nav-item" data-view="budgets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Presupuestos y Fijos
        </button>
        <button class="nav-item" data-view="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          Analítica y Reportes
        </button>
        <button class="nav-item" data-view="accounts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          Cuentas y Patrimonio
        </button>
        <button class="nav-item" data-view="couple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Pareja y Metas
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Importar, Exportar y Ajustes
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="cycle-pill" id="sidebar-cycle-pill">
          <span>Ciclo actual</span>
          <strong class="num">--</strong>
        </div>
        <button class="btn btn-sm" id="btn-theme-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          Cambiar tema
        </button>
      </div>
    </aside>

    <!-- Main Container -->
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <div>
            <h1 class="topbar-title" id="view-title">Resumen Ejecutivo</h1>
            <div class="topbar-subtitle" id="view-subtitle">Panorama financiero personal y en pareja</div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="mobile-ws-wrap">
            <select id="mobile-ws-select" aria-label="Vista activa" style="padding: 6px 10px; font-size: 12px; font-weight: 600;">
              <option value="solo_a">Solo (Yo)</option>
              <option value="couple">En Pareja</option>
              <option value="all">Consolidado</option>
            </select>
          </div>
          <button class="btn btn-sm" id="btn-topbar-scan" title="Escanear recibo IA">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span class="hide-xs">Recibo IA</span>
          </button>
          <button class="btn btn-sm" id="btn-install-pwa" style="display:none;">Instalar App</button>
          <button class="btn btn-icon btn-sm" id="btn-topbar-theme" title="Cambiar tema">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <main class="main-content" id="app-main"></main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav" aria-label="Navegación móvil">
      <button class="m-nav-btn active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Inicio
      </button>
      <button class="m-nav-btn" data-view="ledger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Movimientos
      </button>
      <button class="m-fab" id="btn-mobile-fab" aria-label="Registrar movimiento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="m-nav-btn" data-view="budgets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Presupuestos
      </button>
      <button class="m-nav-btn" data-view="more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        Más
      </button>
    </nav>
  </div>

  <!-- Dynamic Modal Backdrop -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal-box" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Modal</h2>
        <button class="btn btn-ghost btn-icon" id="modal-close" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modular Classic Scripts (work both over http://localhost and file://) -->
  <script defer src="./js/i18n.js"></script>
  <script defer src="./js/store.js"></script>
  <script defer src="./js/charts.js"></script>
  <script defer src="./js/ai-receipt.js"></script>
  <script defer src="./js/csv-io.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
